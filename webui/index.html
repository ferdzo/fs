<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fs</title>
<style>
:root{--bg:#fff;--fg:#16181d;--muted:#6b7280;--line:#e5e7eb;--card:#f8fafc;--accent:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e8ee;--muted:#9aa3b2;--line:#242a35;--card:#161a21;--accent:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main,header{max-width:960px;margin:0 auto;padding:0 20px}
header{padding-top:40px}
h1{margin:0;font-size:20px;letter-spacing:.02em}
h2{font-size:15px;margin:28px 0 8px}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.card strong{display:block;margin-top:4px;font-size:20px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:500;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--card)}
form{display:flex;gap:8px;margin:8px 0 12px}
input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{min-height:20px;color:var(--muted);font-size:13px}
.status.error{color:#d33}
#objects-panel{padding-bottom:48px}
</style>
</head>
<body>
<header>
<h1>fs</h1>
<p class="muted">Object store overview</p>
</header>
<main>
<section class="cards" aria-label="Summary">
<div class="card"><span class="label">Buckets</span><strong id="s-buckets">&ndash;</strong></div>
<div class="card"><span class="label">Objects</span><strong id="s-objects">&ndash;</strong></div>
<div class="card"><span class="label">Logical</span><strong id="s-logical">&ndash;</strong></div>
<div class="card"><span class="label">Physical</span><strong id="s-physical">&ndash;</strong></div>
<div class="card"><span class="label">Dedup</span><strong id="s-dedup">&ndash;</strong></div>
</section>
<p id="status" class="status" role="status"></p>
<section>
<h2>Buckets</h2>
<table>
<thead><tr><th>Name</th><th>Objects</th><th>Size</th></tr></thead>
<tbody id="buckets"></tbody>
</table>
</section>
<section id="objects-panel" hidden>
<h2>Objects in <span id="bucket-name"></span></h2>
<form id="prefix-form">
<input id="prefix" placeholder="prefix" autocomplete="off" aria-label="Prefix">
<button type="submit">Load</button>
</form>
<table>
<thead><tr><th>Key</th><th>Size</th><th>ETag</th><th>Modified</th></tr></thead>
<tbody id="objects"></tbody>
</table>
<p id="objects-note" class="muted"></p>
</section>
</main>
<script>
(function () {
  "use strict";
  var base = location.pathname.replace(/\/+$/, "");
  var token = sessionStorage.getItem("fs-ui-token") || "";
  var asked = false;
  var LIMIT = 200;

  function el(id) { return document.getElementById(id); }
  function setStatus(message, isError) {
    var node = el("status");
    node.textContent = message;
    node.className = isError ? "status error" : "status";
  }
  function count(n) { return Number(n || 0).toLocaleString(); }
  function bytes(n) {
    n = Number(n || 0);
    var units = ["B", "KB", "MB", "GB", "TB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n >= 10 ? 0 : 1)) + " " + units[i];
  }
  function request(path) {
    var headers = {};
    if (token) { headers.Authorization = "Bearer " + token; }
    return fetch(base + path, { headers: headers }).then(function (res) {
      if (res.status === 401 && !asked) {
        asked = true;
        var entered = window.prompt("Access token");
        if (entered) {
          token = entered;
          sessionStorage.setItem("fs-ui-token", entered);
          return request(path);
        }
      }
      if (!res.ok) {
        throw new Error(res.status === 401 ? "unauthorized" : "request failed (" + res.status + ")");
      }
      return res.json();
    });
  }
  function cell(row, value) {
    var td = document.createElement("td");
    td.textContent = value;
    row.appendChild(td);
  }
  function loadSummary() {
    return request("/api/summary").then(function (summary) {
      el("s-buckets").textContent = count(summary.buckets);
      el("s-objects").textContent = count(summary.objects);
      el("s-logical").textContent = bytes(summary.logicalBytes);
      el("s-physical").textContent = bytes(summary.physicalBytes);
      var ratio = summary.physicalBytes > 0 ? summary.logicalBytes / summary.physicalBytes : 0;
      el("s-dedup").textContent = ratio > 0 ? ratio.toFixed(1) + "x" : "\u2013";
    });
  }
  function loadBuckets() {
    return request("/api/buckets").then(function (buckets) {
      var body = el("buckets");
      body.textContent = "";
      if (!buckets.length) {
        var empty = document.createElement("tr");
        var td = document.createElement("td");
        td.colSpan = 3;
        td.className = "muted";
        td.textContent = "No buckets.";
        empty.appendChild(td);
        body.appendChild(empty);
        return;
      }
      buckets.forEach(function (bucket) {
        var row = document.createElement("tr");
        row.className = "clickable";
        cell(row, bucket.name);
        cell(row, count(bucket.objects));
        cell(row, bytes(bucket.bytes));
        row.addEventListener("click", function () { openBucket(bucket.name); });
        body.appendChild(row);
      });
    });
  }
  function openBucket(name) {
    el("objects-panel").hidden = false;
    el("bucket-name").textContent = name;
    el("prefix").value = "";
    loadObjects(name, "");
  }
  function loadObjects(bucket, prefix) {
    setStatus("Loading\u2026", false);
    return request("/api/objects?bucket=" + encodeURIComponent(bucket) + "&prefix=" + encodeURIComponent(prefix))
      .then(function (objects) {
        var body = el("objects");
        body.textContent = "";
        objects.forEach(function (object) {
          var row = document.createElement("tr");
          cell(row, object.key);
          cell(row, bytes(object.size));
          cell(row, object.etag || "");
          cell(row, object.lastModified || "");
          body.appendChild(row);
        });
        el("objects-note").textContent = objects.length >= LIMIT ? "Showing the first " + LIMIT + " objects." : "";
        setStatus(objects.length + (objects.length === 1 ? " object." : " objects."), false);
      })
      .catch(function (err) { setStatus(err.message, true); });
  }

  el("prefix-form").addEventListener("submit", function (event) {
    event.preventDefault();
    loadObjects(el("bucket-name").textContent, el("prefix").value);
  });

  loadSummary().then(loadBuckets).then(function () { setStatus("", false); })
    .catch(function (err) { setStatus(err.message, true); });
})();
</script>
</body>
</html>
